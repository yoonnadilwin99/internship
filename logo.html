<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .utility {
            width: auto;
            height: 30px;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            column-gap: normal;
            background-color: blue;
            padding: 10px 30px;
        }

        .HAC {
            display: flex;
            justify-content: space-between;
            align-items: center;
            column-gap: 30px;
        }

        .HAC a {
            color: white;
        }

        .ft {
            display: flex;
            justify-content: space-between;
            text-align: center;
            align-items: center;
            column-gap: 30px;


        }

        .fea {
            padding-top: 10px;
            padding-left: 140px;
            padding-bottom: 10px;
            margin-left: 30px;
            margin-top: 30px;
            margin-right: 30px;
            width: 350px;
            height: 50px;
            display: flex;
            column-gap: 30px;
            align-items: center;
            text-align: center;
            justify-content: space-between;
        }

        .Controls {
            display: flex;
            gap: 20px;


        }

        .left {
            border: 1px solid black;
            padding: 10px 10px;
            margin: 50px;
            row-gap: 40px;
            width: 700px;
            height: 330px;
        }

        /* .form{
            gap:20px;
        } */
        .form {
            display: flex;
            flex-direction: column;
            padding: 5px;
            gap: 10px;
            /* background-color: red; */

            ;
        }

        .right {
            border: 1px solid black;
            padding: 10px 10px;
            margin: 50px;
            row-gap: 40px;
            width: 700px;
            height: 330px;
            display: flex;
            background-color: white;

        }

        .Alex {
            color: white;
            row-gap: 20px;
            padding-top: 50px;
            padding-left: 50px;
            padding-bottom: 100px;
            width: 300px;
            height: 50px;
            margin: auto;
            background-color: blue;
            justify-content: center;
            flex-direction: column;
            padding-right: 30px;
        }

        .button {
            border: none;
            color: white;
            /* row-gap: 20px; */
            padding: 20px;
            background-color: blue;
            text-align: center;
            display: inline-block;
            font-size: 16px;
            margin-left: 60px;

        }

        .Submit {
            border: none;
            color: white;
            /* row-gap: 20px; */
            padding: 20px;
            background-color: blue;
            text-align: center;
            display: inline-block;
            font-size: 16px;
            margin-left: 60px;

        }

        .CUS {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="CUS">
        <h1>CSS Utility Simulator</h1>
        <p>Change the inputs below to see how automatic classes combine to build Uls</p>
    </div>
    <nav>
        <div class="utility">My Logo</div>
        <div class="HAC">
            <a href>Home</a>
            <a href>About</a>
            <a href>Contact</a>

        </div>
    </nav>
    <div class="ft">
        <div class="fea" style="background-color: rgb(166, 166, 199);">
            <p>Feature 1</p>
        </div>
        <div class="fea" style="background-color: rgb(166, 166, 199);">
            <p>Feature 2</p>
        </div>
        <div class="fea" style="background-color: rgb(166, 166, 199);">
            <p>Feature 3</p>
        </div>
    </div>
    <div class="Controls">
        <div class="left">
            <h2>Utility Controls</h2>
            <div class="form">
                <label>Padding (Spacing)</label>
                <select>
                    <option>Medium (p-8)</option>
                </select>

                <label>Background Theme(Colors)</label>
                <select>
                    <option>Primary Blue</option>
                </select>
                <label>Text Size (Typography)</label>
                <select>
                    <option>Large (text-xl)</option>
                </select>

                <label>Corner Radius (Borders)</label>
                <select>
                    <option>Square (rounded-none)</option>
                </select>
                <label>Shadow (Depth)</label>
                <select>
                    <option>Medium (shadow-md)</option>
                </select>
            </div>

        </div>

        <div class="right">
            <div class="Alex">
                <h2>Alex Walker</h2>
                <p>Full-Stack Web Developer building awesome things with Tailwind CSS.</p>
            </div>
        </div>
    </div>
    <div class="button" button type="Submit">Submit</div>
    <div class="Submit" button type="Submit">Hover Me Slowly</div>

</body>

</html>
