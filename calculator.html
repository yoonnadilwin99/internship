<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      h1 {
        margin-bottom: 10px;
      }
      .cal {
        border: 1px solid black;
        text-align: center;
        align-items: center;
        justify-content: center;
        margin-left: 500px;
        margin-right: 500px;
        margin-top: 100px;
        width: 500px;
        height: 300px;
        padding-top: 25px;
      }
      .txtbox {
        display: flex;
        margin-bottom: 30px;
        padding-left: 30px;
        padding-right: 30px;
        padding-top: 25px;
        gap: 20px;
        justify-content: space-between;
      }
      .button {
        border: none;
        color: white;
        padding: 15px;
        background-color: blue;
        text-align: center;
        align-items: center;
        display: inline-block;
        font-size: 16px;
        width: 435px;
        height: 4px;
        padding-bottom: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
        cursor: pointer;
      }
      .result-box {
        border: 0.5px solid black;
        border-radius: 7px;
        text-align: center;
        display: flex;
        align-items: center;

        /* display: flex; */
        justify-content: space-between;
        /* margin: 50px; */
        /* margin-left: 50px;
            margin-right: 50px;  */
        margin: auto;
        width: 435px;
        height: 30px;
        /* background-color: brown; */
        padding: 20px;
      }
      .result {
        color: rgb(24, 28, 155);
      }
      .input {
        border: 1px solid black;
        border-radius: 5px;
        width: 200px;
        height: 30px;
        padding-left: 15px;
      }
      .ope {
        border: 1px solid black;
        border-radius: 5px;
        width: 50px;
        height: 30px;
      }
    </style>
  </head>
  <body>
    <div class="cal">
      <h1>Mini Calculator</h1>
      <div class="txtbox">
        <input type="number" id="number1" class="input" />
        <select id="operator" class="ope">
          <option value="+">+</option>
          <option value="-">-</option>
          <option value="*">*</option>
          <option value="/">/</option>
        </select>
        <input type="number" id="number2" class="input" />
      </div>
      <!-- <div class="button"  onclick="Calculate()">Calculate Amount</div> -->
      <button class="button" onclick="calculateAmount()">
        Calculate Amount
      </button>
      <div class="result-box">
        <span>Result:</span>
        <span class="result" id="result">0</span>
      </div>
    
    <script>
      function calculateAmount() {
        const num1 = parseFloat(document.getElementById("number1").value);
        const num2 = parseFloat(document.getElementById("number2").value);
        const operator = document.getElementById("operator").value;
        const resultEl = document.getElementById("result");
        
        if(number1.value===""|| number2.value===""){
        numberOutput.textContent="Please enter a number";
        return;
        }
        let result;
        switch (operator) {
          case "+":
            result = num1 + num2;
            break;
          case "-":
            result = num1 - num2;
            break;
          case "*":
            result = num1 * num2;
            break;
          case "/":
            result = num2 !== 0 ? num1 / num2 : "Can't divide by zero";
            break;
          default:
            result = "Error";
        }
        numberOutput.textContent=result;
      }
    </script>
    </div>
  </body>
    
  
</html>
