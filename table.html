<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
table,th,td{
        border:2px dashed rgb(145, 178, 98);
         border-collapse:collapse;
    }  
 
.no{
    text-align: center;
    text-decoration-color: aqua;
}
.name{
    text-align: left;
}
.gender{

}
.rono{

}
.mark{

}

    </table>

</html>
