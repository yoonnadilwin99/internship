<!doctype html>
 <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-200">
    <div class="bg-white w-1/3 mt-20 p-4 mx-auto flex justify-between items-start rounded-lg ">
      <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold">Update Variables</h2>
        <label class="text-sm font-bold">Name (String):</label>
        <input type="text" class="border" id="nameInput" />

        <label class="text-sm font-bold">Age (Number):</label>
        <input type="text" class="border" id="ageInput" />

        <label class="text-sm font-bold">VIP Status(Boolean):</label>
        <input type="checkbox" class="border" id="vipInput" />

        <label class="text-sm font-bold">Card Color:</label>
        <input type="color" id="colorInput" />
      </div>
      <div class="flex flex-col gap-6 mr-4">
        <h2 class="flex justify-start text-xl font-bold ">Live DOM Output</h2>
        <div id="box" class="box border-black border-2 rounded-lg p-4 w-40 mr-8 break-all">
          <span id="vipBadge" class="hidden border-none border-2 rounded-lg p-2 bg-yellow-500">VIP MEMBER</span>
          <h3 id="nameOutput"></h3> 
          <p>Age:<span id="ageOutput"></span></p>
        </div>
      </div>
    </div>
  </body>
  <script>
    const nameInput = document.getElementById("nameInput");
    const ageInput = document.getElementById("ageInput");
    const vipInput = document.getElementById("vipInput");
    const colorInput = document.getElementById("colorInput");

    const nameOutput = document.getElementById("nameOutput");
    const ageOutput = document.getElementById("ageOutput");
    const vipBadge = document.getElementById("vipBadge");
    const box = document.querySelector(".box");

    // Name update
    nameInput.addEventListener("input", () => {
      nameOutput.textContent = nameInput.value ;
    });

    // Age update
    ageInput.addEventListener("input", () => {
      ageOutput.textContent = ageInput.value ;
    });

    // VIP checkbox
    vipInput.addEventListener("change", () => {
      if (vipInput.checked) {
        vipBadge.style.display = "inline-block";
      } else {
        vipBadge.style.display = "none";
      }
    });

    // Color change
    colorInput.addEventListener("input", () => {
      box.style.backgroundColor = colorInput.value;
    });
  </script>
  
</html>
